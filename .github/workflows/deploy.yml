name: Deploy to Oracle

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 130.110.109.47
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script_stop: true
          script: |
            cd /home/ubuntu/streamza-relay
            git fetch origin main
            git reset --hard origin/main
            npm install --omit=dev
            sudo systemctl restart streamza-relay
            sleep 2
            curl -sf -o /dev/null http://localhost:3000/ && echo "Deploy OK — server responding"
