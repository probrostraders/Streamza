<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Streamza — Admin Dashboard</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <style>
    :root{--red:#FF3B30;--bg:#000;--card:#141417;--card2:#0c0c0e;--line:#26262c;--txt:#fff;--sub:#9b9ba3;--ok:#34C759;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.5;}
    a{color:inherit;text-decoration:none;}
    .wrap{max-width:1080px;margin:0 auto;padding:0 20px;}
    .btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:10px;padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer;transition:.15s;}
    .btn-primary{background:var(--red);color:#fff;} .btn-primary:hover{background:#ff5247;}
    .btn-ghost{background:transparent;color:#fff;border:1px solid var(--line);}
    .btn-sm{padding:7px 12px;font-size:13px;}
    .btn-danger{background:#2a1414;color:#ff5247;border:1px solid #5a2020;}

    /* login */
    .login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
    .login .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:34px 30px;width:100%;max-width:380px;text-align:center;}
    .login img{width:48px;height:48px;border-radius:12px;margin-bottom:14px;}
    .login h1{font-size:24px;letter-spacing:-.02em;}
    .login h1 b{color:var(--red);}
    .login p{color:var(--sub);font-size:14px;margin:6px 0 20px;}
    .login input{width:100%;background:var(--card2);border:1px solid var(--line);color:#fff;border-radius:10px;padding:13px;font-size:15px;margin-bottom:14px;}
    .login .err{color:var(--red);font-size:13px;min-height:18px;margin:10px 0 0;}

    /* dashboard */
    header{position:sticky;top:0;z-index:30;background:rgba(0,0,0,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);}
    header .wrap{display:flex;align-items:center;justify-content:space-between;height:62px;}
    .brand{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:800;}
    .brand img{width:28px;height:28px;border-radius:8px;} .brand b{color:var(--red);}
    .brand .tag{font-size:11px;font-weight:700;color:var(--sub);border:1px solid var(--line);border-radius:20px;padding:2px 9px;margin-left:4px;text-transform:uppercase;letter-spacing:.05em;}
    main{padding:28px 0 60px;}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px;}
    @media(max-width:760px){.stats{grid-template-columns:1fr 1fr;}}
    .stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;}
    .stat .k{font-size:12px;color:var(--sub);text-transform:uppercase;letter-spacing:.04em;}
    .stat .v{font-size:32px;font-weight:800;margin-top:6px;letter-spacing:-.02em;}
    .stat .v small{font-size:15px;color:var(--sub);font-weight:600;}
    .stat .v.green{color:var(--ok);}
    .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:20px;}
    .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
    .panel-head h2{font-size:17px;font-weight:700;}
    .panel-head .sub{color:var(--sub);font-size:13px;}
    table{width:100%;border-collapse:collapse;font-size:14px;}
    th{text-align:left;color:var(--sub);font-size:12px;text-transform:uppercase;letter-spacing:.04em;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);}
    td{padding:11px 10px;border-bottom:1px solid #1c1c20;vertical-align:middle;}
    tr:last-child td{border-bottom:0;}
    .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;}
    .pill.live{background:rgba(255,59,48,.16);color:var(--red);}
    .pill.dot i{width:7px;height:7px;border-radius:50%;background:var(--red);display:inline-block;}
    .empty{color:var(--sub);font-size:14px;text-align:center;padding:26px 0;}
    .mono{font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;color:#cfcfd6;}
    .muted{color:var(--sub);}
    .updated{color:var(--sub);font-size:12px;text-align:right;margin-top:4px;}
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div class="login" id="login">
    <div class="card">
      <img src="/logo.svg" alt="Streamza" />
      <h1>Stream<b>za</b> Admin</h1>
      <p>Sign in to your owner dashboard</p>
      <input type="password" id="key" placeholder="Admin password" autocomplete="current-password" />
      <button class="btn btn-primary" style="width:100%;justify-content:center;" id="loginBtn">Sign in</button>
      <p class="err" id="err"></p>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dash" style="display:none;">
    <header>
      <div class="wrap">
        <span class="brand"><img src="/logo.svg" alt="" />Stream<b>za</b><span class="tag">Admin</span></span>
        <div style="display:flex;gap:10px;align-items:center;">
          <a class="btn btn-ghost btn-sm" href="/studio" target="_blank">Open Studio ↗</a>
          <button class="btn btn-ghost btn-sm" id="logoutBtn">Log out</button>
        </div>
      </div>
    </header>
    <main>
      <div class="wrap">
        <div class="stats">
          <div class="stat"><div class="k">Users captured</div><div class="v" id="sLeads">—</div></div>
          <div class="stat"><div class="k">Pro waitlist</div><div class="v" id="sWait">—</div></div>
          <div class="stat"><div class="k">Live now</div><div class="v" id="sLive">—</div></div>
          <div class="stat"><div class="k">Subscriptions</div><div class="v" id="sSubs" style="font-size:20px;">—</div></div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <h2>Live streams</h2>
            <span class="sub" id="liveSub">—</span>
          </div>
          <div id="liveWrap"></div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <h2>Recent signups</h2>
            <a class="btn btn-ghost btn-sm" id="csvBtn" href="#">Download all (CSV)</a>
          </div>
          <div id="leadsWrap"></div>
        </div>

        <p class="updated" id="updated"></p>
      </div>
    </main>
  </div>

  <script>
    const $ = (id)=>document.getElementById(id);
    const KKEY = "streamza_admin_key";
    let KEY = localStorage.getItem(KKEY) || "";

    function fmtDur(s){s=Math.max(0,s|0);const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);return h>0?h+"h "+m+"m":m+"m";}
    function esc(x){return (x==null?"":String(x)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
    function timeAgo(iso){const t=Date.parse(iso);if(!t)return esc(iso);const s=(Date.now()-t)/1000;if(s<60)return"just now";if(s<3600)return Math.floor(s/60)+"m ago";if(s<86400)return Math.floor(s/3600)+"h ago";return Math.floor(s/86400)+"d ago";}

    async function downloadCsv(){
      const r = await fetch("/owner/leads", { headers: { "x-admin-key": KEY } });
      if(!r.ok){ logout(); return; }
      const blob = await r.blob();
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = "streamza-leads.csv";
      document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
    }

    async function load(){
      try{
        const r = await fetch("/admin/api/overview", { headers: { "x-admin-key": KEY } });
        if(r.status===401){ logout(); return; }
        const d = await r.json();
        show(true);
        $("sLeads").textContent = d.totalLeads;
        $("sWait").textContent = d.totalWaitlist;
        $("sLive").innerHTML = d.slotsBusy+' <small>/ '+d.slotsTotal+'</small>';
        $("sLive").className = "v"+(d.slotsBusy>0?" green":"");
        $("sSubs").innerHTML = d.paymentsLive ? (d.totalSubscribers + ' <small class="muted">subscriber' + (d.totalSubscribers===1?'':'s') + '</small>') : 'Free beta <small class="muted">(payments off)</small>';
        $("liveSub").textContent = d.slotsBusy+" of "+d.slotsTotal+" slots in use";
        $("csvBtn").onclick = (e)=>{ e.preventDefault(); downloadCsv(); };

        // live streams
        if(!d.active.length){
          $("liveWrap").innerHTML = '<p class="empty">No active streams right now.</p>';
        } else {
          $("liveWrap").innerHTML = '<table><thead><tr><th>Slot</th><th>User</th><th>File</th><th>Destination</th><th>Uptime</th><th>Time left</th><th></th></tr></thead><tbody>'+
            d.active.map(a=>'<tr>'+
              '<td><span class="pill live dot"><i></i>'+a.id+'</span></td>'+
              '<td>'+esc(a.email)+'</td>'+
              '<td class="muted">'+esc(a.file)+'</td>'+
              '<td class="mono">'+esc(a.dest)+'</td>'+
              '<td>'+fmtDur(a.uptime)+'</td>'+
              '<td>'+fmtDur(a.secondsLeft)+'</td>'+
              '<td><button class="btn btn-danger btn-sm" data-stop="'+a.id+'">Stop</button></td>'+
            '</tr>').join('')+'</tbody></table>';
          document.querySelectorAll('[data-stop]').forEach(b=>b.onclick=()=>stopSlot(b.getAttribute('data-stop')));
        }

        // recent signups
        if(!d.recentLeads.length){
          $("leadsWrap").innerHTML = '<p class="empty">No signups yet.</p>';
        } else {
          $("leadsWrap").innerHTML = '<table><thead><tr><th>Email</th><th>Source</th><th>When</th></tr></thead><tbody>'+
            d.recentLeads.map(l=>'<tr><td>'+esc(l.email)+'</td><td class="muted">'+esc(l.source)+'</td><td class="muted">'+timeAgo(l.timestamp)+'</td></tr>').join('')+
            '</tbody></table>';
        }
        $("updated").textContent = "Updated "+new Date().toLocaleTimeString();
      }catch(e){ /* keep last view */ }
    }

    async function stopSlot(id){
      if(!confirm("Stop the stream in slot "+id+"? This frees the slot for others.")) return;
      await fetch("/admin/api/stop?slot="+id,{method:"POST",headers:{"x-admin-key":KEY}});
      load();
    }

    function show(loggedIn){
      $("login").style.display = loggedIn ? "none" : "flex";
      $("dash").style.display = loggedIn ? "block" : "none";
    }
    function logout(){ localStorage.removeItem(KKEY); KEY=""; show(false); }

    $("loginBtn").onclick = async()=>{
      const v = $("key").value.trim();
      if(!v){ $("err").textContent="Enter your admin password."; return; }
      const r = await fetch("/admin/api/overview", { headers: { "x-admin-key": v } });
      if(r.ok){ KEY=v; localStorage.setItem(KKEY,v); $("err").textContent=""; load(); startPoll(); }
      else { $("err").textContent="Wrong password."; }
    };
    $("key").addEventListener("keydown",e=>{ if(e.key==="Enter") $("loginBtn").click(); });
    $("logoutBtn").onclick = logout;

    let poll=null;
    function startPoll(){ if(poll) clearInterval(poll); poll=setInterval(load,5000); }

    // auto-login if key stored
    if(KEY){ load(); startPoll(); } else { show(false); }
  </script>
</body>
</html>
