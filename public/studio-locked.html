<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Studio — Coming Back Soon | Streamza</title>
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      padding: 24px;
    }
    .box { max-width: 480px; text-align: center; }
    img { width: 56px; height: 56px; margin-bottom: 20px; }
    h1 { font-size: 28px; margin: 0 0 12px; }
    p { color: #aeaeb2; line-height: 1.5; margin: 0 0 28px; }
    a.btn {
      display: inline-block; background: #FF3B30; color: #fff; text-decoration: none;
      font-weight: 700; padding: 14px 28px; border-radius: 999px; margin: 0 6px 12px;
    }
    a.ghost { display: inline-block; color: #aeaeb2; text-decoration: none; font-size: 14px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="box">
    <img src="logo.svg" alt="Streamza" />
    <h1>Web Studio is taking a short break</h1>
    <p>We're focused on Streamza Loop, our Android app for 24/7 looping streams — multistream to YouTube, Facebook and Twitch, manage it all from your phone. Web Studio will be back.</p>
    <a class="btn" href="/">← Back to streamza.live</a>
    <div><a class="ghost" href="/support.html">Need help with something else?</a></div>
  </div>
</body>
</html>
